name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run check
  ai-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: cd supabase/functions/planner-ai && deno check index.ts
      - run: npm run test:ai-local
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: '1' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: artifacts/, if-no-files-found: ignore }
